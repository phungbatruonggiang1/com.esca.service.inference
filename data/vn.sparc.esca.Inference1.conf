<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="vn.sparc.esca.Inference1"/>
    <allow send_destination="vn.sparc.esca.Inference1"/>
    <allow receive_sender="vn.sparc.esca.Inference1"/>
  </policy>

  <!-- The same group owns the tensor buffers in /dev/shm: being allowed to
       call the service and being able to map its buffers go together. -->
  <policy group="inference">
    <allow send_destination="vn.sparc.esca.Inference1"/>
    <allow receive_sender="vn.sparc.esca.Inference1"/>
  </policy>

  <policy context="default">
    <deny own="vn.sparc.esca.Inference1"/>
    <deny send_destination="vn.sparc.esca.Inference1"/>
  </policy>
</busconfig>
