# esca-inferenced settings. Every line is optional; these are the defaults.

# Model configurations (*.json), read at startup and on Refresh().
#config_dir = /etc/esca/inference/models.d

# Inference worker threads, and threads for loading and async context creation.
#workers = 2
#pool_threads = 2

# How many CPU-backend requests run at once before the CPU counts as busy and
# a model allowed elsewhere is sent there instead.
#cpu_slots = 2

# Never let a model load leave less than this much memory available; unload
# idle models when the kernel reports memory stalls above this percentage.
#memory_reserve_mb = 128
#pressure_threshold = 10

# lru: unload the least recently used idle model when memory runs short.
# none: never unload on its own; a load that does not fit fails.
#eviction = lru

# fifo: arrival order. priority: highest priority first, with ageing.
#scheduling = fifo

# Group that may call the service and map its tensor buffers.
#shm_group = inference

#log_level = INFO
